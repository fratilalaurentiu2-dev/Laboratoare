<!doctype html>
<html>
  <head>
    <title>Modificare folosind clase si evenimente</title>
  </head>
  <body>
    <h1>
      Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa
      cum este indicat in textele de deasupra lor
    </h1>
    La click vor aparea Pisici
    <hr />
    <img
      class="animal"
      src="pesti.jpg"
      alt="Niste pesti"
      width="160"
      height="120"
    />
    <br />
    <br />
    La mouseover vor aparea Munti
    <hr />
    <img
      class="peisaj"
      src="desert.jpg"
      alt="O jungla"
      width="160"
      height="120"
    />
    <br />
    <br />
    La click vor aparea Caini
    <hr />
    <img
      class="animal"
      src="egrete.jpg"
      alt="Niste egrete"
      width="160"
      height="120"
    />
    <br />
    <br />
    la mouseout va aparea o Mare
    <hr />
    <img
      class="peisaj"
      src="jungla.jpg"
      alt="Un desert"
      width="160"
      height="120"
    />

    <script>
      // Utilizati getElementsByClassName() pentru a modifica imaginile pentru a se potrivi cu textele de deasupra lor la aparitia evenimentelor indicate!
      var animale = document.getElementsByClassName("animal");
      var peisaje = document.getElementsByClassName("peisaj");
      animale[0].onclick = function () {
        animale[0].src = "Img/pisici.jpg";
      };
      peisaje[0].onmouseover = function () {
        peisaje[0].src = "Img/munti.jpg";
      };
      animale[1].onclick = function () {
        animale[1].src = "Img/caini.jpg";
      };
      peisaje[1].onmouseout = function () {
        peisaje[1].src = "Img/mare.jpg";
      };
    </script>
    <br />
    <a href="index.html">Înapoi la Laboratorul 6</a>
  </body>
</html>
