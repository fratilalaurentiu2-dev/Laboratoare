<!doctype html>
<html>
  <head>
    <title>Acest titlu va fi modificat cu JS</title>
  </head>
  <body>
    <p>
      Salutare, <br />
      oameni buni! <br />
      (De modificat culoarea de background cu js!)
    </p>

    <p>
      Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile
      indicate in paragrafele alaturate, <br />
      precum si titlul paginii !
    </p>

    <p>
      Acest text va fi colorat <br />folosind <br />
      JavaScript
    </p>

    <script>
      var paragrafe = document.getElementsByTagName("p");
      paragrafe[0].style.color = "red";
      paragrafe[paragrafe.length - 1].style.color = "blue";

      document.title = "Titlu modificat cu document.title";
      // Utilizati getElementsByTagName() si element.style.color/backgroundColor, precum si document.title!
    </script>
  </body>
</html>
