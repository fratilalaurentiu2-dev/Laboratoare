<!doctype html>
<html>
  <head>
    <title>Modificare folosind clase</title>
  </head>
  <body>
    <h1>
      Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa
      cum este indicat in textele de deasupra lor
    </h1>
    Pisici
    <hr />
    <img
      class="animal"
      src="pesti.jpg"
      alt="Niste pesti"
      width="160"
      height="120"
    />
    <br />
    <br />
    Munti
    <hr />
    <img
      class="peisaj"
      src="desert.jpg"
      alt="O jungla"
      width="160"
      height="120"
    />
    <br />
    <br />
    Caini
    <hr />
    <img
      class="animal"
      src="egrete.jpg"
      alt="Niste egrete"
      width="160"
      height="120"
    />
    <br />
    <br />
    Mare
    <hr />
    <img
      class="peisaj"
      src="jungla.jpg"
      alt="Un desert"
      width="160"
      height="120"
    />

    <script>
      var animale = document.getElementsByClassName("animal");
      animale[0].src = "img/pisici.jpg";
      animale[1].src = "img/caini.jpg";

      var peisaje = document.getElementsByClassName("peisaje");
      peisaje[0].src = "img/munti.jpg";
      peisaje[1].src = "img/mare.jpg";
    </script>
  </body>
</html>
