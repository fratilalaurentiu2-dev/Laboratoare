<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_B1</title>
    <style>
      body {
        background-color: #ffffcc;
      }
      .center {
        text-align: center;
        color: white;
      }
      h1 {
        background-color: #00cc66;
        color: orange;
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      .centre {
        border: 5px solid blue;
        padding: 15px;
      }
      #s1 {
        background-color: blue;
      }
      #s2 {
        background-color: yellow;
      }
      #s2 table {
        background-color: pink;
      }
      div {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="center">Tabele formatate</h1>
    <div id="s1">
      <table style="width: 100%" class="center">
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
      <br />
    </div>

    <!--id-urile sunt motivul pentru care tabelele au background colorat. au style intern, desi tabelul la prima vedere nu are -->
    <div id="s2" style="width: 50%">
      <br />
      <table style="width: 100%" class="centre">
        <tr>
          <th class="centre">Firstname</th>
          <th class="centre">Lastname</th>
          <th class="centre">Age</th>
        </tr>
        <tr>
          <td class="centre">Jill</td>
          <td class="centre">Smith</td>
          <td class="centre">50</td>
        </tr>
        <!-- celulele care difera, nu corespund aceluiasi styling (unele nu au adica); unele nu sunt in clasa "center" -->
        <tr>
          <td class="centre">Eve</td>
          <td class="centre">Jackson</td>
          <td class="centre">94</td>
        </tr>
      </table>
    </div>
  </body>
</html>
