<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_C1</title>
    <style>
      #hd {
        font-variant: small-caps;
        color: magenta;
        background-color: #cccc00;
      }
      caption {
        color: white;
        background-color: orange;
        font-size: 1.5em;
      }
      body {
        background-color: #ffffcc;
      }
      .center,
      p {
        text-align: center;
        color: red;
      }
      .tablec th {
        background-color: magenta;
      }
      .tablec {
        border-collapse: collapse;
      }
      .tablec th,
      .tablec td {
        border: 4px solid green;
        padding: 16px;
      }
      .tablec td {
        background-color: orange;
      }
      .tablec .team {
        background-color: magenta;
        color: black;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 id="hd">Tabel special</h1>
    <p>Un tabel cu "celule lipite"</p>
    <table class="tablec" style="width: 100%">
      <caption>
        Echipe si hobby-uri
      </caption>
      <tr>
        <th>Echipa</th>
        <th>Nume</th>
        <th colspan="2">Pasiuni</th>
      </tr>
      <tr>
        <td class="team" rowspan="3">Munte</td>
        <td>Popescu</td>
        <td>calatorii</td>
        <td>filatelie</td>
      </tr>
      <tr>
        <td>Ionescu</td>
        <td>planorism</td>
        <td>sah</td>
      </tr>
      <tr>
        <td>Andreiescu</td>
        <td>planism</td>
        <td>sahism</td>
      </tr>
      <tr>
        <td class="team" rowspan="4">Mare</td>
        <td>Georgescu</td>
        <td>plaja</td>
        <td>dans</td>
      </tr>
      <tr>
        <td>Gigescu</td>
        <td>surf</td>
        <td>samba</td>
      </tr>
      <tr>
        <td>Mintescu</td>
        <td>politica</td>
        <td>delicateturi</td>
      </tr>
      <tr>
        <td>Calinescu</td>
        <td>giocuri</td>
        <td>fotbal</td>
      </tr>
    </table>
  </body>
</html>
