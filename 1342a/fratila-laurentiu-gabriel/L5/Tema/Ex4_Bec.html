<!doctype html>
<html>
  <head>
    <title>Bec</title>
    <script>
      function changeImage() {
        var image = document.getElementById("bec2");
        if (image.src.match("stins")) {
          image.src = "Bec aprins.gif";
        } else {
          image.src = "Bec stins.gif";
        }
      }
    </script>
  </head>
  <body>
    <h1>Bec stins</h1>

    <p>
      <img
        id="bec2"
        onmouseover="changeImage()"
        src="Bec stins.gif"
        width="100"
        height="180"
      />
    </p>
  </body>
</html>
