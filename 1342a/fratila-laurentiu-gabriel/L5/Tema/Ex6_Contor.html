<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      var aprinderi = 0;

      function changeImage() {
        var bec = document.getElementById("bec");
        var contor = document.getElementById("contor");

        if (bec.src.match("Bec%20stins.gif")) {
          bec.src = "Bec aprins.gif";
          aprinderi++;
          contor.textContent = "Becul a fost aprins de " + aprinderi + " ori.";
        } else {
          bec.src = "Bec stins.gif";
        }
      }
    </script>
  </head>
  <body>
    <h1>Contor pentru bec</h1>
    <p>
      <img
        id="bec"
        onclick="changeImage()"
        src="Bec stins.gif"
        alt="Bec stins"
        width="100"
        height="180"
      />
    </p>
    <p id="contor">Becul a fost aprins de 0 ori.</p>
  </body>
</html>
